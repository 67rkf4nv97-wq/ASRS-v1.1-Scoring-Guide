<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ASRS v1.1">
<meta name="theme-color" content="#ffffff">
<title>ASRS v1.1 Scorer</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --blue: #185FA5; --blue-light: #E6F1FB; --blue-dark: #0C447C;
  --amber-light: #FAEEDA; --amber-dark: #854F0B;
  --gray-50: #F7F6F3; --gray-100: #EEECEA; --gray-200: #D3D1C7;
  --text: #1a1a18; --text-muted: #5F5E5A; --text-faint: #888780;
  --border: rgba(0,0,0,0.12); --border-med: rgba(0,0,0,0.2);
  --surface: #ffffff; --surface-2: #F7F6F3;
  --radius: 10px; --radius-lg: 14px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --text: #F0EEE8; --text-muted: #A8A69E; --text-faint: #6E6C66;
    --border: rgba(255,255,255,0.1); --border-med: rgba(255,255,255,0.18);
    --surface: #1C1C1A; --surface-2: #252522;
    --gray-50: #252522; --gray-100: #2E2E2B; --gray-200: #3a3a37;
    --blue-light: #0d2d4a; --blue: #4A9BE8; --blue-dark: #7BB8F0;
    --amber-light: #2d200a; --amber-dark: #F5C060;
  }
}
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
  font-size: 16px; color: var(--text); background: var(--surface-2);
  min-height: 100dvh;
  padding-bottom: calc(80px + var(--safe-bottom));
}

.header {
  position: sticky; top: 0; z-index: 100;
  background: var(--surface); border-bottom: 0.5px solid var(--border);
  padding: 12px 16px 10px;
  padding-top: calc(12px + env(safe-area-inset-top, 0px));
}
.header-inner { display: flex; align-items: center; justify-content: space-between; }
.header-title { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; }
.header-sub { font-size: 12px; color: var(--text-faint); margin-top: 1px; }
.btn-ghost {
  font-size: 14px; color: var(--blue); background: none; border: none;
  padding: 6px 10px; border-radius: 8px; cursor: pointer; font-weight: 500;
  -webkit-tap-highlight-color: transparent;
}
.btn-ghost:active { background: var(--blue-light); }

.progress-bar-wrap {
  background: var(--surface); padding: 0 16px 10px;
  border-bottom: 0.5px solid var(--border);
}
.progress-track { height: 3px; background: var(--gray-100); border-radius: 2px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--blue); border-radius: 2px; transition: width 0.3s ease; width: 0%; }
.progress-label { font-size: 11px; color: var(--text-faint); margin-top: 5px; }

.kbd-hint {
  background: var(--blue-light); border-bottom: 0.5px solid var(--border);
  padding: 8px 16px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
}
.kbd-hint-label { font-size: 11px; font-weight: 600; color: var(--blue-dark); white-space: nowrap; }
.kbd-chips { display: flex; gap: 4px; flex-wrap: wrap; }
.kbd-chip {
  display: inline-flex; align-items: center; gap: 3px;
  background: var(--surface); border: 0.5px solid var(--border-med);
  border-radius: 5px; padding: 2px 6px; font-size: 11px; font-weight: 600;
  color: var(--text); white-space: nowrap;
}

.section-header { padding: 20px 16px 8px; }
.section-title { font-size: 18px; font-weight: 600; letter-spacing: -0.3px; }
.section-desc { font-size: 13px; color: var(--text-muted); margin-top: 4px; line-height: 1.5; }

.q-card {
  background: var(--surface); border-radius: var(--radius-lg);
  margin: 0 12px 10px; overflow: hidden; border: 0.5px solid var(--border);
  transition: border-color 0.15s;
}
.q-card.focused { border-color: var(--blue); border-width: 1.5px; }

.q-head {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 14px 14px 10px;
}
.q-num {
  flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%;
  background: var(--gray-100); display: flex; align-items: center;
  justify-content: center; font-size: 11px; font-weight: 600;
  color: var(--text-muted); margin-top: 1px; transition: background 0.15s, color 0.15s;
}
.q-num.answered { background: var(--blue); color: #fff; }
.q-text { font-size: 14px; line-height: 1.55; color: var(--text); flex: 1; }
.q-domain {
  flex-shrink: 0; font-size: 10px; font-weight: 600; padding: 3px 7px;
  border-radius: 5px; margin-top: 2px; letter-spacing: 0.04em;
}
.domain-i { background: var(--blue-light); color: var(--blue-dark); }
.domain-h { background: var(--amber-light); color: var(--amber-dark); }

.radio-grid {
  display: grid; grid-template-columns: repeat(5, 1fr);
  border-top: 0.5px solid var(--border);
}
.radio-col {
  display: flex; flex-direction: column; align-items: center;
  padding: 6px 2px 8px; border-right: 0.5px solid var(--border);
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: background 0.1s; position: relative;
}
.radio-col:last-child { border-right: none; }
.radio-col.shaded { background: var(--gray-50); }
.radio-col:active { background: var(--gray-100); }
input[type=radio] { display: none; }

.key-badge {
  font-size: 10px; font-weight: 700; color: var(--text-faint);
  background: var(--gray-100); border-radius: 3px; padding: 1px 4px;
  margin-bottom: 5px; line-height: 1.4; display: block;
}

.radio-circle {
  width: 20px; height: 20px; border-radius: 50%;
  border: 1.5px solid var(--border-med);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 4px; flex-shrink: 0; transition: all 0.15s;
  background: var(--surface);
}
.radio-col.selected .radio-circle { background: var(--blue); border-color: var(--blue); }
.radio-col.selected.shaded .radio-circle { background: var(--blue-dark); border-color: var(--blue-dark); }
.radio-check { width: 8px; height: 8px; border-radius: 50%; background: #fff; opacity: 0; transition: opacity 0.15s; }
.radio-col.selected .radio-check { opacity: 1; }
.radio-label { font-size: 9px; color: var(--text-faint); text-align: center; line-height: 1.3; }
.radio-col.selected .radio-label { color: var(--blue); font-weight: 600; }
.radio-col.selected.shaded .radio-label { color: var(--blue-dark); }

#kbd-capture {
  position: fixed; opacity: 0; pointer-events: none;
  width: 1px; height: 1px; top: 0; left: 0; border: none;
}

.score-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--surface); border-top: 0.5px solid var(--border);
  padding: 12px 16px; padding-bottom: calc(12px + var(--safe-bottom)); z-index: 100;
}
.btn-score {
  width: 100%; background: var(--blue); color: #fff; border: none;
  border-radius: var(--radius); font-size: 16px; font-weight: 600;
  padding: 14px; cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: opacity 0.15s;
}
.btn-score:active { opacity: 0.85; }

.warn {
  margin: 0 12px 10px; background: #FEF3C7; color: #92400E;
  border-radius: var(--radius); padding: 10px 14px; font-size: 13px; display: none;
}
.warn.visible { display: block; }

/* Results */
.results-screen { display: none; padding-bottom: calc(32px + var(--safe-bottom)); }
.results-screen.visible { display: block; }

.metric-grid {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 8px; padding: 12px 12px 0; margin-bottom: 10px;
}
.metric-tile {
  background: var(--surface); border-radius: var(--radius);
  border: 0.5px solid var(--border); padding: 12px 10px; text-align: center;
}
.metric-tile .val { font-size: 26px; font-weight: 700; color: var(--text); letter-spacing: -0.5px; }
.metric-tile .denom { font-size: 14px; font-weight: 400; color: var(--text-faint); }
.metric-tile .lbl { font-size: 11px; color: var(--text-faint); margin-top: 3px; line-height: 1.3; }

.result-card {
  margin: 0 12px 10px; border-radius: var(--radius-lg);
  padding: 14px 16px; border: 0.5px solid var(--border);
  background: var(--surface);
}
.result-card.pos { background: var(--blue-light); border-color: var(--blue); }
.result-card .rc-title { font-size: 15px; font-weight: 600; margin-bottom: 5px; }
.result-card.pos .rc-title { color: var(--blue-dark); }
.result-card .rc-body { font-size: 13px; line-height: 1.6; color: var(--text-muted); }

.domain-card {
  margin: 0 12px 10px; background: var(--surface);
  border-radius: var(--radius-lg); border: 0.5px solid var(--border); overflow: hidden;
}
.dc-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px; border-bottom: 0.5px solid var(--border);
}
.domain-card.met .dc-header { background: var(--blue-light); }
.dc-title { font-size: 14px; font-weight: 600; }
.domain-card.met .dc-title { color: var(--blue-dark); }
.dc-score { font-size: 22px; font-weight: 700; }
.dc-denom { font-size: 14px; font-weight: 400; color: var(--text-faint); }
.domain-card.met .dc-score { color: var(--blue-dark); }
.dc-body { padding: 10px 14px; }
.dc-body p { font-size: 13px; color: var(--text-muted); line-height: 1.5; }
.dc-badge {
  display: inline-block; font-size: 11px; font-weight: 600;
  padding: 3px 8px; border-radius: 6px; margin-bottom: 5px;
}
.domain-card.met .dc-badge { background: var(--blue); color: #fff; }
.domain-card:not(.met) .dc-badge { background: var(--gray-100); color: var(--text-faint); }

.pres-card {
  margin: 0 12px 10px; background: var(--surface);
  border-radius: var(--radius-lg); border: 0.5px solid var(--border); padding: 14px 16px;
}
.pres-label { font-size: 11px; font-weight: 600; color: var(--text-faint); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 4px; }
.pres-value { font-size: 16px; font-weight: 600; color: var(--text); line-height: 1.4; }
.pres-note { font-size: 13px; color: var(--text-muted); margin-top: 5px; line-height: 1.5; }

.disc-card {
  margin: 0 12px 10px; background: var(--surface);
  border-radius: var(--radius); border: 0.5px solid var(--border); padding: 12px 14px;
}
.disc-card p { font-size: 11px; color: var(--text-faint); line-height: 1.7; }

.btn-edit {
  display: block; width: calc(100% - 24px); margin: 4px 12px 8px;
  background: none; border: 1.5px solid var(--blue); color: var(--blue);
  border-radius: var(--radius); font-size: 15px; font-weight: 600;
  padding: 13px; cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.btn-edit:active { background: var(--blue-light); }
.btn-new {
  display: block; width: calc(100% - 24px); margin: 0 12px;
  background: none; border: 0.5px solid var(--border-med); color: var(--text-muted);
  border-radius: var(--radius); font-size: 15px; font-weight: 500;
  padding: 13px; cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.btn-new:active { background: var(--gray-100); }
</style>
</head>
<body>

<input type="text" id="kbd-capture" inputmode="none" autocomplete="off" readonly tabindex="-1">

<!-- QUESTIONNAIRE -->
<div id="questionnaire">
  <div class="header">
    <div class="header-inner">
      <div>
        <div class="header-title">ASRS v1.1</div>
        <div class="header-sub">Provider scoring · DSM-5-TR</div>
      </div>
      <button class="btn-ghost" onclick="resetAll()">Reset</button>
    </div>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="progress-label" id="progress-label">0 of 18 answered</div>
  </div>

  <div class="kbd-hint">
    <span class="kbd-hint-label">Keys:</span>
    <div class="kbd-chips">
      <span class="kbd-chip">0 = Never</span>
      <span class="kbd-chip">1 = Rarely</span>
      <span class="kbd-chip">2 = Sometimes</span>
      <span class="kbd-chip">3 = Often</span>
      <span class="kbd-chip">4 = Very Often</span>
    </div>
  </div>

  <div id="q-sections"></div>
  <div class="warn" id="warn-incomplete">Please answer all 18 items before scoring.</div>
  <div style="height:80px"></div>

  <div class="score-bar">
    <button class="btn-score" onclick="scoreAll()">Score questionnaire</button>
  </div>
</div>

<!-- RESULTS -->
<div class="results-screen" id="results-screen">
  <div class="header">
    <div class="header-inner">
      <div>
        <div class="header-title">Results</div>
        <div class="header-sub">ASRS v1.1 · DSM-5-TR</div>
      </div>
      <button class="btn-ghost" onclick="resetAll()">New</button>
    </div>
  </div>
  <div id="results-body"></div>
  <button class="btn-edit" onclick="editAnswers()">Edit answers</button>
  <button class="btn-new" onclick="resetAll()">Start new assessment</button>
  <div style="height:32px"></div>
</div>

<script>
const ITEMS = [
  {n:1,  part:'A', domain:'I', text:'Trouble wrapping up the final details of a project, once the challenging parts have been done', threshold:'sometimes'},
  {n:2,  part:'A', domain:'I', text:'Difficulty getting things in order when you have to do a task that requires organization', threshold:'sometimes'},
  {n:3,  part:'A', domain:'I', text:'Problems remembering appointments or obligations', threshold:'sometimes'},
  {n:4,  part:'A', domain:'I', text:'Avoid or delay getting started on a task that requires a lot of thought', threshold:'often'},
  {n:5,  part:'A', domain:'H', text:'Fidget or squirm with hands or feet when sitting down for a long time', threshold:'often'},
  {n:6,  part:'A', domain:'H', text:'Feel overly active and compelled to do things, like driven by a motor', threshold:'often'},
  {n:7,  part:'B', domain:'I', text:'Make careless mistakes when working on a boring or difficult project', threshold:'often'},
  {n:8,  part:'B', domain:'I', text:'Difficulty keeping attention when doing boring or repetitive work', threshold:'often'},
  {n:9,  part:'B', domain:'I', text:'Difficulty concentrating on what people say, even when speaking directly to you', threshold:'sometimes'},
  {n:10, part:'B', domain:'I', text:'Misplace or have difficulty finding things at home or at work', threshold:'often'},
  {n:11, part:'B', domain:'I', text:'Distracted by activity or noise around you', threshold:'often'},
  {n:12, part:'B', domain:'H', text:'Leave your seat in meetings or situations in which you are expected to remain seated', threshold:'sometimes'},
  {n:13, part:'B', domain:'H', text:'Feel restless or fidgety', threshold:'often'},
  {n:14, part:'B', domain:'H', text:'Difficulty unwinding and relaxing when you have time to yourself', threshold:'often'},
  {n:15, part:'B', domain:'H', text:'Find yourself talking too much in social situations', threshold:'often'},
  {n:16, part:'B', domain:'H', text:'Finishing sentences of people you are talking to before they can finish them', threshold:'sometimes'},
  {n:17, part:'B', domain:'H', text:'Difficulty waiting your turn in situations when turn-taking is required', threshold:'often'},
  {n:18, part:'B', domain:'H', text:'Interrupt others when they are busy', threshold:'sometimes'},
];

const FREQS       = ['never','rarely','sometimes','often','veryoften'];
const FREQ_LABELS = ['Never','Rarely','Some-\ntimes','Often','Very\nOften'];
const KEY_MAP     = {'0':'never','1':'rarely','2':'sometimes','3':'often','4':'veryoften'};
const POSITIVE_AT = {sometimes:['sometimes','often','veryoften'], often:['often','veryoften']};

const responses = {};
let focusedItem = 1;
let scoredOnce  = false;

/* ── Build UI ── */
function buildUI() {
  const container = document.getElementById('q-sections');
  container.innerHTML = '';

  [
    {id:'A', title:'Part A — Screener',      desc:'6 questions · threshold ≥4 positive items'},
    {id:'B', title:'Part B — Supplementary', desc:'12 questions · used for presentation mapping'}
  ].forEach(part => {
    const sec = document.createElement('div');
    sec.innerHTML = `<div class="section-header"><div class="section-title">${part.title}</div><div class="section-desc">${part.desc}</div></div>`;
    container.appendChild(sec);

    ITEMS.filter(i => i.part === part.id).forEach(item => {
      const card = document.createElement('div');
      card.className = 'q-card';
      card.id = `card-${item.n}`;
      card.addEventListener('click', () => setFocus(item.n, false));

      const domClass = item.domain === 'I' ? 'domain-i' : 'domain-h';
      const domLabel = item.domain === 'I' ? 'Inatt' : 'H/I';

      const radioHTML = FREQS.map((f, fi) => {
        const shaded = POSITIVE_AT[item.threshold].includes(f);
        return `<label class="radio-col${shaded?' shaded':''}" id="rc-${item.n}-${f}"
                  onclick="selectResponse(${item.n},'${f}')">
          <span class="key-badge">${fi}</span>
          <input type="radio" name="q${item.n}" value="${f}">
          <div class="radio-circle"><div class="radio-check"></div></div>
          <span class="radio-label">${FREQ_LABELS[fi].replace('\n','<br>')}</span>
        </label>`;
      }).join('');

      card.innerHTML = `
        <div class="q-head">
          <div class="q-num" id="qnum-${item.n}">${item.n}</div>
          <div class="q-text">${item.text}</div>
          <div class="q-domain ${domClass}">${domLabel}</div>
        </div>
        <div class="radio-grid">${radioHTML}</div>`;
      container.appendChild(card);
    });
  });
}

/* ── Focus ── */
function setFocus(n, scroll=true) {
  const oldCard = document.getElementById(`card-${focusedItem}`);
  if (oldCard) oldCard.classList.remove('focused');

  focusedItem = n;
  const card = document.getElementById(`card-${n}`);
  if (card) {
    card.classList.add('focused');
    if (scroll) setTimeout(() => card.scrollIntoView({behavior:'smooth', block:'center'}), 60);
  }
  document.getElementById('kbd-capture').focus({preventScroll:true});
}

/* ── Select response ── */
function selectResponse(n, freq) {
  responses[n] = freq;

  FREQS.forEach(f => {
    const col = document.getElementById(`rc-${n}-${f}`);
    if (col) col.classList.toggle('selected', f === freq);
  });

  const num = document.getElementById(`qnum-${n}`);
  if (num) num.classList.add('answered');

  updateProgress();
  document.getElementById('warn-incomplete').classList.remove('visible');

  if (n < 18) {
    setFocus(n + 1, true);
  } else {
    const card = document.getElementById(`card-${n}`);
    if (card) card.classList.remove('focused');
    if (Object.keys(responses).length === 18) {
      setTimeout(scoreAll, 350);
    }
  }
}

/* ── Keyboard ── */
document.addEventListener('keydown', e => {
  if (document.getElementById('results-screen').classList.contains('visible')) return;
  if (KEY_MAP[e.key] !== undefined) {
    e.preventDefault();
    selectResponse(focusedItem, KEY_MAP[e.key]);
  }
});

document.getElementById('q-sections').addEventListener('click', () => {
  setTimeout(() => document.getElementById('kbd-capture').focus({preventScroll:true}), 50);
});

/* ── Progress ── */
function updateProgress() {
  const n = Object.keys(responses).length;
  document.getElementById('progress-fill').style.width = Math.round(n/18*100) + '%';
  document.getElementById('progress-label').textContent = `${n} of 18 answered`;
}

/* ── Scoring ── */
function isPositive(item, response) {
  return POSITIVE_AT[item.threshold].includes(response);
}

function scoreAll() {
  if (Object.keys(responses).length < 18) {
    document.getElementById('warn-incomplete').classList.add('visible');
    document.getElementById('warn-incomplete').scrollIntoView({behavior:'smooth', block:'center'});
    return;
  }

  const partAItems = ITEMS.slice(0, 6);
  const partAPos   = partAItems.filter(i => isPositive(i, responses[i.n])).length;
  const partAScore = partAItems.reduce((s, i) => s + FREQS.indexOf(responses[i.n]), 0);
  const screenPos  = partAPos >= 4;

  const inattItems = ITEMS.filter(i => i.domain === 'I');
  const hiItems    = ITEMS.filter(i => i.domain === 'H');
  const inattPos   = inattItems.filter(i => isPositive(i, responses[i.n])).length;
  const hiPos      = hiItems.filter(i => isPositive(i, responses[i.n])).length;
  const inattMet   = inattPos >= 5;
  const hiMet      = hiPos >= 5;

  let presentation, presentationNote;
  if (inattMet && hiMet) {
    presentation = 'Combined presentation';
    presentationNote = 'Both inattention and hyperactive-impulsive criteria met (≥5 each).';
  } else if (inattMet) {
    presentation = 'Predominantly inattentive presentation';
    presentationNote = 'Inattention criterion met; hyperactive-impulsive criterion not met.';
  } else if (hiMet) {
    presentation = 'Predominantly hyperactive-impulsive presentation';
    presentationNote = 'Hyperactive-impulsive criterion met; inattention criterion not met.';
  } else {
    presentation = 'Subthreshold — neither domain meets criterion';
    presentationNote = 'Neither domain reaches the DSM-5-TR threshold of ≥5 symptoms.';
  }

  const band = partAScore <= 9 ? 'Low negative' : partAScore <= 13 ? 'High negative' : partAScore <= 17 ? 'Low positive' : 'High positive';

  document.getElementById('results-body').innerHTML = `
    <div class="metric-grid">
      <div class="metric-tile">
        <div class="val">${partAPos}<span class="denom">/6</span></div>
        <div class="lbl">Part A positive<br>(shaded-box)</div>
      </div>
      <div class="metric-tile">
        <div class="val">${partAScore}<span class="denom">/24</span></div>
        <div class="lbl">Part A score<br>(0–24 · ${band})</div>
      </div>
      <div class="metric-tile">
        <div class="val">${inattPos}<span class="denom">/9</span></div>
        <div class="lbl">Inattention<br>positive items</div>
      </div>
      <div class="metric-tile">
        <div class="val">${hiPos}<span class="denom">/9</span></div>
        <div class="lbl">Hyperactive-<br>Impulsive positive</div>
      </div>
    </div>

    <div class="result-card ${screenPos?'pos':''}">
      <div class="rc-title">${screenPos?'Part A screen positive':'Part A screen negative'} (${partAPos}/6)</div>
      <div class="rc-body">${screenPos
        ? 'Symptoms highly consistent with adult ADHD. Further evaluation warranted — assess impairment, onset before age 12, cross-setting evidence, and rule out differentials.'
        : 'Does not meet the Part A threshold of ≥4 positive items. ADHD remains possible if clinical history is compelling; Part A sensitivity is ~91% and does not rule out the diagnosis.'
      }</div>
    </div>

    <div class="domain-card ${inattMet?'met':''}">
      <div class="dc-header">
        <div class="dc-title">Inattention</div>
        <div class="dc-score">${inattPos}<span class="dc-denom">/9</span></div>
      </div>
      <div class="dc-body">
        <span class="dc-badge">${inattMet?'≥5 met':'Not met'}</span>
        <p>${inattMet?'Meets DSM-5-TR criterion A (inattention) for adults ≥17.':'Does not meet DSM-5-TR criterion A threshold of ≥5 inattention symptoms.'}</p>
      </div>
    </div>

    <div class="domain-card ${hiMet?'met':''}">
      <div class="dc-header">
        <div class="dc-title">Hyperactive-Impulsive</div>
        <div class="dc-score">${hiPos}<span class="dc-denom">/9</span></div>
      </div>
      <div class="dc-body">
        <span class="dc-badge">${hiMet?'≥5 met':'Not met'}</span>
        <p>${hiMet?'Meets DSM-5-TR criterion A (hyperactivity-impulsivity) for adults ≥17.':'Does not meet DSM-5-TR criterion A threshold of ≥5 H/I symptoms.'}</p>
      </div>
    </div>

    <div class="pres-card">
      <div class="pres-label">Symptom profile</div>
      <div class="pres-value">${presentation}</div>
      <div class="pres-note">${presentationNote}</div>
    </div>

    <div class="disc-card">
      <p>Scoring: Kessler et al. (2005). Item-level thresholds: items 1–3, 9, 12, 16, 18 positive at Sometimes+; remaining items at Often+. 0–24 continuous score per 2024 Harvard update (cutpoint ≥14; bands: 0–9 low negative, 10–13 high negative, 14–17 low positive, 18–24 high positive). DSM-5-TR criterion A: ≥5 symptoms per domain, adults ≥17. Output is symptom profile only — not a diagnosis. Requires onset before age 12, cross-setting impairment in ≥2 settings, and exclusion of other explanations. For use by licensed clinicians only.</p>
    </div>
  `;

  scoredOnce = true;
  document.getElementById('questionnaire').style.display = 'none';
  document.getElementById('results-screen').classList.add('visible');
  window.scrollTo(0, 0);
}

/* ── Edit ── */
function editAnswers() {
  document.getElementById('questionnaire').style.display = 'block';
  document.getElementById('results-screen').classList.remove('visible');
  window.scrollTo(0, 0);
  setFocus(focusedItem, false);
}

/* ── Reset ── */
function resetAll() {
  Object.keys(responses).forEach(k => delete responses[k]);
  focusedItem = 1;
  scoredOnce  = false;
  buildUI();
  updateProgress();
  document.getElementById('warn-incomplete').classList.remove('visible');
  document.getElementById('questionnaire').style.display = 'block';
  document.getElementById('results-screen').classList.remove('visible');
  window.scrollTo(0, 0);
}

buildUI();
updateProgress();
setFocus(1, false);
</script>
</body>
</html>
